name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # next build runs linting and full TypeScript checking — fails the PR
      # before broken code can reach main / production
      - run: npm run build
        env:
          # Dummy values so the build doesn't need real credentials
          INTERCOM_ACCESS_TOKEN: ci-placeholder
          CLOSE_API_KEY: ci-placeholder
          STRIPE_SECRET_KEY: ci-placeholder
          ANTHROPIC_API_KEY: ci-placeholder
